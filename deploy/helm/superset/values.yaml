# superset with the trino driver installed at startup. the secret key and the admin password
# are placeholders for a local demo, change them for anything exposed outside the machine.
bootstrapScript: |
  #!/bin/bash
  pip install trino sqlalchemy-trino 2>/dev/null || pip install trino
extraSecretEnv:
  SUPERSET_SECRET_KEY: airpulse-local-demo-secret-key-change-me
init:
  adminUser:
    username: admin
    password: admin
    firstname: airpulse
    lastname: admin
    email: admin@localhost
supersetNode:
  replicas:
    replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
supersetWorker:
  replicas:
    replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi
supersetCeleryBeat:
  enabled: false
postgresql:
  enabled: true
  primary:
    persistence:
      size: 2Gi
redis:
  enabled: true
  master:
    persistence:
      enabled: false
