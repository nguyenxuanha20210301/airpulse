# trino with a hive catalog on the metastore and a cassandra catalog on the ring, one worker on
# dev. the demo values file adds a second worker for the scaling comparison.
server:
  workers: 1
  config:
    query:
      maxMemory: 2GB
coordinator:
  jvm:
    maxHeapSize: 1536M
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi
worker:
  jvm:
    maxHeapSize: 1536M
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi
catalogs:
  hive: |
    connector.name=hive
    hive.metastore.uri=thrift://hive-metastore:9083
    # trino 484 ships without a file system for hdfs urls unless the hadoop one is enabled.
    fs.hadoop.enabled=true
    hive.non-managed-table-writes-enabled=true
  cassandra: |
    connector.name=cassandra
    cassandra.contact-points=cassandra
    cassandra.load-policy.dc-aware.local-dc=datacenter1
    cassandra.consistency-level=ONE
