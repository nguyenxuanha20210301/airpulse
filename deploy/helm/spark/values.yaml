# kubeflow spark operator, applications are submitted in the airpulse namespace only. the chart
# creates the spark-operator-spark service account that the applications reference.
spark:
  jobNamespaces:
    - airpulse
controller:
  replicas: 1
  # every submission forks a spark-submit jvm inside the controller, so the reconcile
  # concurrency bounds the memory peak. ten workers were oom killed at 512Mi when the
  # scheduled jobs and the speed layer were submitted in the same second.
  workers: 3
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
webhook:
  enable: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
prometheus:
  metrics:
    enable: true
