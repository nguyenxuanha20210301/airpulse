# two executors per batch job, the benchmark of docs/results/batch_scaling.md found four only 3
# percent faster than two on one machine, and the third executor took memory the speed layer needs.
- op: replace
  path: /spec/template/arguments/2
  value: /etc/airpulse/demo.yaml
- op: replace
  path: /spec/template/executor/instances
  value: 2
