# standalone hive metastore with an embedded derby database on a volume. spark registers the
# hdfs datasets here and trino reads the same catalog.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
data:
  hive-site.xml: |
    <?xml version="1.0"?>
    <configuration>
      <property><name>metastore.thrift.uris</name><value>thrift://hive-metastore:9083</value></property>
      <property><name>metastore.warehouse.dir</name><value>hdfs://hdfs-namenode:8020/airpulse/warehouse</value></property>
      <property><name>hive.metastore.warehouse.dir</name><value>hdfs://hdfs-namenode:8020/airpulse/warehouse</value></property>
      <property><name>javax.jdo.option.ConnectionURL</name><value>jdbc:derby:;databaseName=/opt/hive/data/metastore_db;create=true</value></property>
      <property><name>javax.jdo.option.ConnectionDriverName</name><value>org.apache.derby.jdbc.EmbeddedDriver</value></property>
      <property><name>metastore.schema.verification</name><value>false</value></property>
      <property><name>hive.metastore.event.db.notification.api.auth</name><value>false</value></property>
    </configuration>
  core-site.xml: |
    <?xml version="1.0"?>
    <configuration>
      <property><name>fs.defaultFS</name><value>hdfs://hdfs-namenode:8020</value></property>
    </configuration>
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
spec:
  selector:
    app: hive-metastore
  ports:
    - name: thrift
      port: 9083
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-metastore
spec:
  serviceName: hive-metastore
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      containers:
        - name: metastore
          image: apache/hive:4.0.1
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: HIVE_CUSTOM_CONF_DIR
              value: /hive_custom_conf
            - name: SERVICE_OPTS
              value: -Xmx512m
          ports:
            - containerPort: 9083
          volumeMounts:
            - name: config
              mountPath: /hive_custom_conf
            - name: data
              mountPath: /opt/hive/data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: hive-metastore-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
