# templates for one off runs, applied by hand with the module and arguments edited. backfill
# loads history into the raw layer, replay publishes history into the replay topics.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: backfill
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: airpulse-spark:local
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/airpulse/run_module.py
  arguments:
    - airpulse.ingestion.backfill
    - --config
    - /etc/airpulse/dev.yaml
    - --start
    - "2024-01-01"
    - --end
    - "2024-12-31"
  sparkVersion: 3.5.9
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: 2g
    serviceAccount: spark-operator-spark
    env:
      - name: AIRPULSE_SPARK__USE_PACKAGES
        value: "false"
      - name: AIRPULSE_HIVE__DDL_FILE
        value: /opt/airpulse/schemas/hive/tables.sql
    volumeMounts:
      - name: configs
        mountPath: /etc/airpulse
      - name: locations
        mountPath: /etc/airpulse/locations
  executor:
    instances: 1
    cores: 1
    memory: 1g
    env:
      - name: AIRPULSE_SPARK__USE_PACKAGES
        value: "false"
      - name: AIRPULSE_HIVE__DDL_FILE
        value: /opt/airpulse/schemas/hive/tables.sql
    volumeMounts:
      - name: configs
        mountPath: /etc/airpulse
      - name: locations
        mountPath: /etc/airpulse/locations
  volumes:
    - name: configs
      configMap:
        name: airpulse-configs
    - name: locations
      configMap:
        name: airpulse-locations
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: replay
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: airpulse-spark:local
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/airpulse/run_module.py
  arguments:
    - airpulse.ingestion.replay
    - --config
    - /etc/airpulse/bench.yaml
    - --shift-to-now
  sparkVersion: 3.5.9
  restartPolicy:
    type: Never
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
    env:
      - name: AIRPULSE_SPARK__USE_PACKAGES
        value: "false"
      - name: AIRPULSE_HIVE__DDL_FILE
        value: /opt/airpulse/schemas/hive/tables.sql
    volumeMounts:
      - name: configs
        mountPath: /etc/airpulse
      - name: locations
        mountPath: /etc/airpulse/locations
  executor:
    instances: 1
    cores: 1
    memory: 1g
    env:
      - name: AIRPULSE_SPARK__USE_PACKAGES
        value: "false"
      - name: AIRPULSE_HIVE__DDL_FILE
        value: /opt/airpulse/schemas/hive/tables.sql
    volumeMounts:
      - name: configs
        mountPath: /etc/airpulse
      - name: locations
        mountPath: /etc/airpulse/locations
  volumes:
    - name: configs
      configMap:
        name: airpulse-configs
    - name: locations
      configMap:
        name: airpulse-locations
