[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airpulse"
version = "0.1.0"
description = "real time analysis and forecasting of weather and air quality trends on a lambda architecture"
readme = "readme.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyspark>=3.5.3,<4",
    "confluent-kafka>=2.3",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyarrow>=14",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
notebook = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "trino>=0.330",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]
# F and T are the usual aliases for pyspark functions and types.
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["airpulse"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --import-mode=importlib"
markers = [
    "integration: needs a running dev cluster",
    "fault_tolerance: kills brokers, datanodes or executors on the dev cluster",
    "benchmark: measures throughput, latency and batch duration",
]
