# values shared by every profile. a profile file names the file it extends and overrides single
# keys. any environment variable named AIRPULSE_<section>__<key> overrides the merged result, for
# example AIRPULSE_KAFKA__BOOTSTRAP_SERVERS, nested keys are joined with a double underscore.
# relative paths in this file are resolved against the directory that holds it.

project: airpulse
schema_version: 1
timezone: Asia/Ho_Chi_Minh
log_level: INFO

locations:
  # sampling points are the centers of the 63 former provinces. the province column holds the
  # unit each point belongs to after the 2025 merger, so results can be grouped either way.
  file: locations/vn_provinces.csv

sources:
  open_meteo:
    weather_url: https://api.open-meteo.com/v1/forecast
    air_quality_url: https://air-quality-api.open-meteo.com/v1/air-quality
    archive_url: https://archive-api.open-meteo.com/v1/archive
    timeout_s: 30
    # the api accepts several coordinates per call, which keeps the daily request count low.
    locations_per_request: 10
    # the forecast endpoint keeps past hours from the models of the live feed, history inside
    # that range is fetched there and only older history from the archive. it accepts start
    # dates three months back but returns empty hours beyond about eight weeks.
    forecast_past_days: 56
    weather_variables:
      - temperature_2m
      - relative_humidity_2m
      - dew_point_2m
      - apparent_temperature
      - precipitation
      - rain
      - weather_code
      - pressure_msl
      - surface_pressure
      - cloud_cover
      - wind_speed_10m
      - wind_direction_10m
      - wind_gusts_10m
    air_variables:
      - pm10
      - pm2_5
      - carbon_monoxide
      - nitrogen_dioxide
      - sulphur_dioxide
      - ozone
      - dust
      - uv_index
      - us_aqi
      - european_aqi
  openaq:
    base_url: https://api.openaq.org/v3
    timeout_s: 30
    # set through AIRPULSE_SOURCES__OPENAQ__API_KEY in .env, never in this file.
    api_key: ""
    radius_m: 25000
    max_stations: 3
  openweathermap:
    base_url: https://api.openweathermap.org/data/2.5
    timeout_s: 30
    api_key: ""
    # the free plan allows 60 calls per minute, keep a margin.
    calls_per_minute: 50

ingestion:
  enabled_sources:
    - open_meteo
  interval_minutes: 30
  # each run refetches the last few hours so late corrections are picked up, duplicates are
  # dropped downstream by event_id.
  past_hours: 3
  history_start: 2015-01-01

kafka:
  bootstrap_servers: ""
  partitions: 3
  replication_factor: 1
  consumer_group_prefix: airpulse
  topics:
    weather_raw: weather.raw
    air_raw: air.raw
    weather_clean: weather.clean
    air_clean: air.clean
    air_alerts: air.alerts

hdfs:
  url: ""
  # every dataset lives under root as <layer>/<dataset>/dt=YYYY-MM-DD.
  root: /airpulse
  replication: 1

cassandra:
  hosts: []
  port: 9042
  keyspace: airpulse
  replication_factor: 1
  consistency: ONE
  tables:
    air_latest: rt_air_latest
    weather_latest: rt_weather_latest
    air_windows: rt_air_windows
    weather_windows: rt_weather_windows
    alerts: rt_alerts
    forecast: rt_forecast

hive:
  # thrift endpoint of the metastore, empty keeps spark on its in memory catalog for laptop runs.
  metastore_uri: ""
  warehouse_dir: warehouse
  # ddl of the external tables, relative to the repo root or the working directory, the spark
  # image sets an absolute path through AIRPULSE_HIVE__DDL_FILE.
  ddl_file: schemas/hive/tables.sql

trino:
  url: ""
  hive_catalog: hive
  cassandra_catalog: cassandra
  schema: airpulse

spark:
  # an empty master keeps whatever spark submit or the operator provides, set local[*] for a laptop run.
  master: ""
  driver_memory: 1g
  executor_instances: 2
  executor_memory: 1g
  executor_cores: 1
  shuffle_partitions: 8
  # connector jars resolved from maven for laptop runs, the cluster image has them baked in and
  # sets use_packages to false. the kafka coordinate must match the installed spark version.
  use_packages: true
  packages:
    - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
    - com.datastax.spark:spark-cassandra-connector_2.12:3.5.1

streaming:
  trigger_interval: 1 minute
  watermark_delay: 2 hours
  windows:
    - 1 hour
    - 3 hours
    - 24 hours
  slide: 1 hour
  # relative to hdfs root.
  checkpoint_dir: checkpoints
  # records one micro batch reads from a topic at most, empty reads all that is available,
  # which turns a backlog into a single large batch.
  max_offsets_per_trigger:

aqi:
  standard: us_epa
  pm2_5_daily_limit_who: 15
  pm2_5_daily_limit_qcvn: 50

ml:
  # gradient boosted trees stay small, the course is about the system, not the model.
  max_iter: 50
  max_depth: 5
  # the last days of the training range are held out to report honest errors.
  test_days: 30
  min_rows: 1000

alerts:
  aqi_level: 150
  temperature_hot_c: 39
  temperature_cold_c: 13

replay:
  # data hours per wall clock hour, 3600 plays one hour of history every second.
  speed_factor: 1
  # with pacing off the replay publishes as fast as kafka accepts, used for throughput tests.
  pacing: true
  # shift timestamps so the first replayed hour lands on the current hour, keeps dashboards live.
  shift_to_now: false
  topic_suffix: replay
  start_date: null
  end_date: null
